2024년 종합소득세신고분부터는 3년 연속 종합소득세를 의뢰하신 고객에 한하여 기장대리로 세무대리 권한을 수임하여 신고진행해 드리고 있습니다. 기장대리와 신고대리와의 차이는 세무대리 책임의 지속성입니다. 꾸준히 믿고 맡겨 주신 감사함에 대한 보답으로 위임권한을 변경하여 수임하고 있습니다.

고객님께 신고는 1년에 한 번 뿐임을 알기에, 보고드리기 전까지 최선의 결과를 내기 위해 온 힘을 다하고 있습니다. 저를 비롯한 전 직원이 다 같은 마음으로 일하고 있습니다. 언제나 그랬듯 내 일처럼 진심으로 성의 있게 일하겠습니다.

const formatCurrency = (val) => {
  if (val === '' || val == null) return '';
  const isNeg = String(val).startsWith('-');
  const digits = String(val).replace(/[^\d]/g, '');
  if (!digits) return isNeg ? '-' : '';
  const formatted = parseInt(digits).toLocaleString('ko-KR');
  return isNeg ? `-${formatted}` : formatted;
};

const isNegativeValue = (val) => val != null && String(val).startsWith('-');

const parseNum = (val) => {
  if (!val) return null;
  const isNeg = String(val).startsWith('-');
  const digits = String(val).replace(/[^\d]/g, '');
  if (!digits) return null;
  const n = parseInt(digits);
  return isNeg ? -n : n;
};

const calculateIncomeRate = (income, revenue) => {
  const i = parseNum(income);
  const r = parseNum(revenue);
  if (i === null || r === null || r === 0) return '';
  // 소득이 음수(결손)인 경우 '-' 표시 (소득률 라인은 유지)
  if (i < 0) return '-';
  return ((i / r) * 100).toFixed(1);
};

const calculateTax = (income) => {
  const i = typeof income === 'number' ? income : parseNum(income);
  if (i === null) return '';
  if (i <= 0) return '0';
  let tax;
  if (i <= 14000000) tax = i * 0.06;
  else if (i <= 50000000) tax = i * 0.15 - 1260000;
  else if (i <= 88000000) tax = i * 0.24 - 5760000;
  else if (i <= 150000000) tax = i * 0.35 - 15440000;
  else if (i <= 300000000) tax = i * 0.38 - 19940000;
  else if (i <= 500000000) tax = i * 0.40 - 25940000;
  else if (i <= 1000000000) tax = i * 0.42 - 35940000;
  else tax = i * 0.45 - 65940000;
  return Math.round(tax).toLocaleString('ko-KR');
};

// 누진구간 세율(%)을 반환 — 양수 소득만 의미 있음
const getProgressiveRate = (income) => {
  if (income == null || income <= 0) return '';
  if (income <= 14000000) return '6';
  if (income <= 50000000) return '15';
  if (income <= 88000000) return '24';
  if (income <= 150000000) return '35';
  if (income <= 300000000) return '38';
  if (income <= 500000000) return '40';
  if (income <= 1000000000) return '42';
  return '45';
};

const computeCalculated = (key, inputs) => {
  if (key === '소득률') return calculateIncomeRate(inputs['소득_당해'], inputs['매출_당해']);
  if (key === '소득률_전년') return calculateIncomeRate(inputs['소득_전년'], inputs['매출_전년']);

  // 기장거래처 산출세액 — 메커니즘 반전:
  //   입력: 조정후 소득 (실제 신고된 사업소득금액)
  //   계산: 조정전 소득 = 조정후 소득 + 추가증빙_경비2
  if (key === '조정전_산출세액') {
    const after = parseNum(inputs['조정후_소득']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    if (after === null || after <= 0) return '';
    return calculateTax(after + adjust);
  }
  if (key === '조정후_산출세액') {
    const after = parseNum(inputs['조정후_소득']);
    if (after === null || after <= 0) return '';
    return calculateTax(after);
  }
  if (key === '종합소득세_절감') {
    const after = parseNum(inputs['조정후_소득']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    if (after === null || after <= 0 || adjust <= 0) return '';
    const taxBefore = parseNum(calculateTax(after + adjust));
    const taxAfter = parseNum(calculateTax(after));
    if (taxBefore === null || taxAfter === null) return '';
    const saving = taxBefore - taxAfter;
    if (saving <= 0) return '';
    return saving.toLocaleString('ko-KR');
  }
  if (key === '지방소득세_절감') {
    const g = parseNum(computeCalculated('종합소득세_절감', inputs));
    if (g === null) return '';
    return Math.round(g * 0.1).toLocaleString('ko-KR');
  }
  if (key === '건강보험료_절감') {
    const adjust = parseNum(inputs['추가증빙_경비2']);
    if (adjust === null || adjust <= 0) return '';
    return Math.round(adjust * 0.0813).toLocaleString('ko-KR');
  }
  if (key === '절세액_합계') {
    const g = parseNum(computeCalculated('종합소득세_절감', inputs)) || 0;
    const j = parseNum(computeCalculated('지방소득세_절감', inputs)) || 0;
    const h = parseNum(computeCalculated('건강보험료_절감', inputs)) || 0;
    const total = g + j + h;
    if (total <= 0) return '';
    return total.toLocaleString('ko-KR');
  }
  if (key === '적용세율_조정전') {
    const after = parseNum(inputs['조정후_소득']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    if (after === null || after <= 0) return '';
    return getProgressiveRate(after + adjust);
  }
  if (key === '지방세율_조정전') {
    const rate = parseFloat(computeCalculated('적용세율_조정전', inputs));
    if (isNaN(rate)) return '';
    return (rate * 0.1).toFixed(1);
  }

  // 신고대리: 수수료 표시 = 수수료(공급가액) × (할인 시 0.9) × 1.1 (VAT 포함)
  if (key === '수수료_표시') {
    const fee = parseNum(inputs['수수료']);
    if (fee === null || fee <= 0) return '';
    const discount = !!inputs['할인적용'];
    const final = discount ? fee * 0.9 * 1.1 : fee * 1.1;
    return Math.round(final).toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 추가경비_총액과 부담없음_매출은 동일 값
  if (key === '부담없음_매출') {
    const raw = inputs['추가경비_총액'] || '';
    const digits = String(raw).replace(/[^\d]/g, '');
    if (!digits) return '';
    return parseInt(digits).toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 반영전 소득 = 반영후 소득 + 추가경비 총액
  if (key === '반영전_소득') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    return (after + cost).toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 종합소득세 절감 = 반영전 산출세액 − 반영후 산출세액
  if (key === '국세절감') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    const before = after + cost;
    const taxBefore = parseNum(calculateTax(before));
    const taxAfter = parseNum(calculateTax(after));
    if (taxBefore === null || taxAfter === null) return '';
    const saving = taxBefore - taxAfter;
    if (saving <= 0) return '';
    return saving.toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 지방소득세 절감 = 종합소득세 절감 × 10%
  if (key === '지방세절감') {
    const gukSaving = parseNum(computeCalculated('국세절감', inputs));
    if (gukSaving === null) return '';
    return Math.round(gukSaving * 0.1).toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 건강보험료 절감 = 추가경비 총액 × 8.13% (2026년 직장가입자: 건보 7.19% + 장기요양 13.14%)
  if (key === '건보절감') {
    const cost = parseNum(inputs['추가경비_총액']);
    if (cost === null || cost <= 0) return '';
    return Math.round(cost * 0.0813).toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 절세액 합계 = 국세절감 + 지방세절감 + 건보절감
  if (key === '절세액') {
    const g = parseNum(computeCalculated('국세절감', inputs)) || 0;
    const j = parseNum(computeCalculated('지방세절감', inputs)) || 0;
    const h = parseNum(computeCalculated('건보절감', inputs)) || 0;
    const total = g + j + h;
    if (total <= 0) return '';
    return total.toLocaleString('ko-KR');
  }
  // 기장(인건비추가): 적용세율 = 반영전 소득의 누진구간 세율 (%)
  if (key === '적용세율') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    return getProgressiveRate(after + cost);
  }
  // 기장(인건비추가): 지방세율 = 적용세율 × 0.1 (소수 1자리)
  if (key === '지방세율') {
    const rate = parseFloat(computeCalculated('적용세율', inputs));
    if (isNaN(rate)) return '';
    return (rate * 0.1).toFixed(1);
  }
  // 기장(인건비추가): 박스1~5 수수료 합 × 1.1 (VAT 포함). 이름이 입력된 박스만 합산.
  if (key === '수수료_합계_VAT포함') {
    let sum = 0;
    for (let n = 1; n <= 5; n++) {
      if (inputs[`박스${n}_이름`] && String(inputs[`박스${n}_이름`]).trim()) {
        sum += parseNum(inputs[`박스${n}_수수료`]) || 0;
      }
    }
    if (sum <= 0) return '';
    return Math.round(sum * 1.1).toLocaleString('ko-KR');
  }
  return '';
};

// 종속 변수(dependsOn)의 값이 채워져 있는지 확인.
// currency 타입을 가정 — 숫자 0 또는 빈 값은 "비어있음"으로 간주.
const isDependencySatisfied = (variable, inputs) => {
  if (!variable || !variable.dependsOn) return true;
  const depVal = inputs[variable.dependsOn];
  if (depVal == null) return false;
  const s = String(depVal).trim();
  if (!s) return false;
  const digits = s.replace(/[^\d]/g, '');
  if (!digits) return false;
  if (parseInt(digits) === 0) return false;
  return true;
};

const Storage = {
  async get(key) {
    try {
      const v = localStorage.getItem('samho_' + key);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem('samho_' + key, JSON.stringify(value));
    } catch (e) {}
  },
  async remove(key) {
    try {
      localStorage.removeItem('samho_' + key);
    } catch (e) {}
  }
};

const parseBody = (body) => {
  const root = { children: [] };
  const stack = [root];
  let lastIndex = 0;
  const re = /\{([^}]+)\}/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    if (m.index > lastIndex) {
      stack[stack.length - 1].children.push({ type: 'text', value: body.slice(lastIndex, m.index) });
    }
    const content = m[1].trim();
    if (content.startsWith('?')) {
      const trigger = content.slice(1).trim();
      const node = { type: 'cond', trigger, children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    } else if (content.startsWith('/?')) {
      const trigger = content.slice(2).trim();
      if (stack.length > 1 && stack[stack.length - 1].trigger === trigger) stack.pop();
    } else if (content.startsWith('@')) {
      // 입력 전용 마커: 에디터에서만 입력 필드를 표시하고, 최종 출력(클립보드)에는 포함되지 않음
      const key = content.slice(1).trim();
      stack[stack.length - 1].children.push({ type: 'inputonly', key });
    } else if (content.startsWith('#')) {
      // 안내 힌트 마커: 에디터에만 회색 작은 글씨로 표시, 카톡 출력에는 포함되지 않음
      const hintText = content.slice(1).trim();
      stack[stack.length - 1].children.push({ type: 'hint', value: hintText });
    } else {
      stack[stack.length - 1].children.push({ type: 'var', key: content });
    }
    lastIndex = re.lastIndex;
  }
  if (lastIndex < body.length) {
    stack[stack.length - 1].children.push({ type: 'text', value: body.slice(lastIndex) });
  }
  return root.children;
};

const isCondActive = (trigger, inputs, variables) => {
  if (trigger.startsWith('!')) return !isCondActive(trigger.slice(1).trim(), inputs, variables);
  const hasAmount = (val) => {
    if (!val) return false;
    const digits = String(val).replace(/[^\d]/g, '');
    if (!digits) return false;
    return parseInt(digits) > 0;
  };
  if (trigger.endsWith('_환급')) {
    const base = trigger.slice(0, trigger.length - '_환급'.length);
    return hasAmount(inputs[base]) && isNegativeValue(inputs[base]);
  }
  if (trigger === '환급발생') return ['국세', '지방세'].some(k => hasAmount(inputs[k]) && isNegativeValue(inputs[k]));
  if (trigger === '세금없음') return ['국세', '지방세'].every(k => !hasAmount(inputs[k]));
  if (trigger === '세금있음') return !isCondActive('세금없음', inputs, variables);
  if (trigger === '_산출세액있음') return hasAmount(inputs['조정후_소득']);
  if (trigger === '_절세효과있음') return computeCalculated('종합소득세_절감', inputs) !== '';
  if (trigger === '_추가증빙있음') return hasAmount(inputs['추가증빙_경비']) || hasAmount(inputs['추가증빙_경비2']);
  if (trigger === '_복수') {
    // 기장(인건비추가): 박스 이름이 채워진 게 2개 이상이면 true
    const names = ['박스1_이름','박스2_이름','박스3_이름','박스4_이름','박스5_이름'];
    return names.filter(k => inputs[k] && String(inputs[k]).trim()).length >= 2;
  }
  if (trigger === '소득률') return computeCalculated('소득률', inputs) !== '';
  if (trigger === '소득률_전년') return computeCalculated('소득률_전년', inputs) !== '';
  if (trigger.endsWith('_있음')) {
    const prefix = trigger.slice(0, trigger.length - '_있음'.length) + '_';
    return Object.keys(inputs).some(k => k.startsWith(prefix) && inputs[k] && String(inputs[k]).trim());
  }
  const variable = variables.find(v => v.key === trigger);
  // 종속 변수(dependsOn) 안전장치:
  //   직원이 추가증빙_경비를 먼저 입력한 뒤 이월결손금을 지운 경우에도
  //   카톡 출력에서 추가증빙_경비 라인이 자동으로 제외되도록 함.
  if (variable?.dependsOn && !isDependencySatisfied(variable, inputs)) return false;
  if (variable?.type === 'switch') return !!inputs[trigger];
  const value = inputs[trigger];
  if (variable?.type === 'currency') return hasAmount(value);
  if (variable?.type === 'calculated') return computeCalculated(trigger, inputs) !== '';
  return !!(value && String(value).trim());
};

// ===== 카톡 출력 정렬: 국세/지방세, 종합소득세/지방소득세 라벨 쌍의 숫자 우측 정렬 =====
// 같은 라벨 군에 속하는 두 줄이 연속해서 나올 때, 짧은 쪽 라벨 뒤에 일반 공백을 더해 자리수를 맞춤.
// (예: "국　세 100,000,000원" / "지방세  10,000,000원")
const ALIGN_PAIRS = [
  ['국　세', '지방세'],
  ['종합소득세', '지방소득세']
];
const alignAmountLines = (text) => {
  if (!text) return text;
  const lines = text.split('\n');
  for (let i = 0; i < lines.length - 1; i++) {
    const a = lines[i];
    const b = lines[i + 1];
    let matched = null;
    for (const [labA, labB] of ALIGN_PAIRS) {
      if (a.startsWith(labA + ' ') && b.startsWith(labB + ' ')) {
        matched = [labA, labB];
        break;
      }
    }
    if (!matched) continue;
    const [labA, labB] = matched;
    const aRest = a.slice(labA.length + 1);
    const bRest = b.slice(labB.length + 1);
    const max = Math.max(aRest.length, bRest.length);
    lines[i]     = labA + ' ' + aRest.padStart(max, ' ');
    lines[i + 1] = labB + ' ' + bRest.padStart(max, ' ');
  }
  return lines.join('\n');
};

  useEffect(() => {

  useEffect(() => {
    const handleMove = (e) => {
      if (!isDragging.current) return;
      const container = splitContainerRef.current;
      if (!container) return;
      const rect = container.getBoundingClientRect();
      // 좌우 분할 — 가로(clientX) 기준
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const x = clientX - rect.left;
      const percent = (x / rect.width) * 100;
      const clamped = Math.max(15, Math.min(85, percent));
      setSplitPos(clamped);
    };
    const handleEnd = () => {
      if (isDragging.current) {
        isDragging.current = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        Storage.set('split_pos_lr', splitPos);
      }
    };
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleEnd);
    };
  }, [splitPos]);

  const handleDragStart = (e) => {
    isDragging.current = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    if (e.preventDefault) e.preventDefault();
  };

  const showToast = (msg, type = 'success') => {
    setToast({ message: msg, type });
    setTimeout(() => setToast(null), 2500);
  };

  const handleAccessSubmit = () => {
    if (accessInput === ACCESS_PASSWORD) {
      setAccessGranted(true);
      Storage.set('access_granted', true);
      setAccessInput('');
      setAccessError(false);
    } else {
      setAccessError(true);
    }
  };

  const handleAccessLogout = () => {
    if (!confirm('이 PC에서 로그아웃하시겠습니까? 다음에 다시 비밀번호를 입력해야 합니다.')) return;
    Storage.remove('access_granted');
    setAccessGranted(false);
    setAdminMode(false);
  };

  // 캐시를 우회하여 GitHub에서 최신 버전을 받아오는 강력 새로고침
  const handleHardReload = () => {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('v', Date.now().toString());
      window.location.replace(url.toString());
    } catch (e) {
      window.location.reload();
    }
  };

  const types = useMemo(() => templates[selectedCategory] ? Object.keys(templates[selectedCategory]) : [], [templates, selectedCategory]);
  const currentList = templates?.[selectedCategory]?.[selectedType]?.[selectedButton] || [];
  const currentTemplate = currentList[0] || null;

  useEffect(() => {
    setInputs({});
    setExtraMemo('');
    inputRefs.current = [];
  }, [selectedCategory, selectedType, selectedButton]);

  // 초기 진입·탭 전환 시 첫 입력 필드(고객명)에 자동 포커스
  useEffect(() => {
    if (!accessGranted || adminMode || !currentTemplate) return;
    const t = setTimeout(() => {
      const first = inputRefs.current[0];
      if (first && first.focus) {
        try {
          first.focus({ preventScroll: true });
          if (first.select) first.select();
        } catch (e) {}
      }
    }, 120);
    return () => clearTimeout(t);
  }, [accessGranted, adminMode, currentTemplate, selectedType, selectedButton]);

  const tree = useMemo(() => currentTemplate ? parseBody(currentTemplate.body) : [], [currentTemplate]);
  const previewParts = useMemo(() => {
    if (!currentTemplate) return [];
    let body = currentTemplate.body;
    const variables = currentTemplate.variables || [];
    // 입력 전용 마커 ({@변수명})는 최종 출력에 포함되지 않음 — 에디터 표시용일 뿐
    body = body.replace(/\{@[^}]+\}/g, '');
    // 안내 힌트 마커 ({#텍스트})도 최종 출력에 포함되지 않음 — 에디터 표시용일 뿐
    body = body.replace(/\{#[^}]+\}/g, '');
    let prev;
    do {
      prev = body;
      body = body.replace(/\{\?(!?[^}]+)\}([\s\S]*?)\{\/\?\1\}/g, (match, key, content) => {
        return isCondActive(key.trim(), inputs, variables) ? content : '';
      });
    } while (prev !== body);
    variables.forEach(v => {
      let val;
      if (v.type === 'calculated') {
        val = computeCalculated(v.key, inputs);
      } else {
        val = inputs[v.key] || '';
        if (v.type === 'currency') {
          const d = String(val).replace(/[^\d]/g, '');
          val = d ? parseInt(d).toLocaleString('ko-KR') : '';
        } else if (v.type === 'switch') {
          val = '';
        }
      }
      body = body.split(`{${v.key}}`).join(`\u0001${v.key}\u0002${val}\u0003`);
    });
    body = body.replace(/\n{3,}/g, '\n\n').trim();
    if (extraMemo && extraMemo.trim()) {
      body += '\n\n[추가 안내]\n' + extraMemo.trim();
    }
    const parts = [];
    let i = 0;
    while (i < body.length) {
      const startIdx = body.indexOf('\u0001', i);
      if (startIdx < 0) {
        if (i < body.length) parts.push({ type: 'text', content: body.slice(i) });
        break;
      }
      if (startIdx > i) parts.push({ type: 'text', content: body.slice(i, startIdx) });
      const keyEnd = body.indexOf('\u0002', startIdx);
      const valueEnd = body.indexOf('\u0003', keyEnd);
      if (keyEnd < 0 || valueEnd < 0) {
        parts.push({ type: 'text', content: body.slice(startIdx) });
        break;
      }
      const key = body.slice(startIdx + 1, keyEnd);
      const value = body.slice(keyEnd + 1, valueEnd);
      parts.push({ type: 'var', key, content: value });
      i = valueEnd + 1;
    }
    return parts;
  }, [currentTemplate, inputs, extraMemo]);

  // 카톡 복사용 텍스트 (라벨 쌍 자동 정렬 적용)
  const plainText = useMemo(() => {
    const raw = previewParts.map(p => p.content).join('');
    return alignAmountLines(raw);
  }, [previewParts]);

  const scrollPreviewToKey = (key) => {
    const container = previewContainerRef.current;
    if (!container) return;
    const target = container.querySelector(`[data-key="${key}"]`);
    if (target) {
      try { target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (er) {}
    }
  };

  useEffect(() => {
    if (focusedKey) {
      const t = setTimeout(() => scrollPreviewToKey(focusedKey), 50);
      return () => clearTimeout(t);
    }
  }, [focusedKey, previewParts]);

  const handleCopy = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(plainText);
        showToast('클립보드에 복사되었습니다 ✓');
        return;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = plainText;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.width = '1px';
      ta.style.height = '1px';
      ta.style.padding = '0';
      ta.style.border = 'none';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      const prevActive = document.activeElement;
      ta.focus({ preventScroll: true });
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (er) {}
      document.body.removeChild(ta);
      if (prevActive && prevActive.focus) {
        try { prevActive.focus({ preventScroll: true }); } catch (er) {}
      }
      if (ok) { showToast('클립보드에 복사되었습니다 ✓'); return; }
    } catch (e) {}
    try {
      const container = previewContainerRef.current;
      if (container) {
        const range = document.createRange();
        range.selectNodeContents(container);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        showToast('자동 선택됨 - Ctrl+C를 눌러 복사하세요', 'error');
        return;
      }
    } catch (e) {}
    showToast('복사 실패 - 미리보기 영역에서 직접 선택해 복사해 주세요', 'error');
  };

  const handleInputChange = (key, value, type) => {
    if (type === 'currency') {
      setInputs(prev => {
        const newHasMinus = String(value).includes('-');
        const digits = String(value).replace(/[^\d]/g, '');
        if (!digits) return { ...prev, [key]: newHasMinus ? '-' : '' };
        return { ...prev, [key]: newHasMinus ? `-${digits}` : digits };
      });
    } else {
      setInputs(prev => ({ ...prev, [key]: value }));
    }
  };

  const handlePasswordSubmit = () => {
    if (passwordInput === adminPassword) {
      setAdminMode(true); setShowAdminLogin(false); setPasswordInput('');
    } else showToast('비밀번호가 일치하지 않습니다', 'error');
  };

  const renderInput = (variable, order, idx) => {
    const rawValue = inputs[variable.key] || '';
    const isOptional = variable.optional;
    const isNeg = isNegativeValue(rawValue);

    // 종속 변수가 있으면 종속 조건이 채워지지 않은 동안 입력 잠금(disabled)
    const isDisabled = !!variable.dependsOn && !isDependencySatisfied(variable, inputs);

    const goNext = () => {
      const next = inputRefs.current[order + 1];
      if (next) { next.focus(); try { next.select(); } catch (er) {} }
    };
    const goPrev = () => {
      const prev = inputRefs.current[order - 1];
      if (prev) { prev.focus(); try { prev.select(); } catch (er) {} }
    };

    if (variable.type === 'textarea') {
      return (
        <textarea
          key={idx}
          ref={el => { inputRefs.current[order] = el; }}
          value={rawValue}
          onChange={(e) => handleInputChange(variable.key, e.target.value, variable.type)}
          onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); goNext(); } }}
          onFocus={(e) => {
            setFocusedKey(variable.key);
            setTimeout(() => {
              try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (er) {}
              scrollPreviewToKey(variable.key);
            }, 0);
          }}
          placeholder={variable.placeholder || variable.label}
          rows={Math.max(2, (rawValue.match(/\n/g) || []).length + 2)}
          className={`block w-full my-1 px-3 py-2 rounded-md text-[14px] leading-relaxed border-2 border-dashed focus:outline-none resize-y placeholder:text-slate-400 text-slate-800 ${
            isOptional ? 'bg-slate-50 border-slate-300 focus:bg-yellow-50 focus:border-yellow-500' : 'bg-blue-50 border-blue-300 focus:bg-yellow-50 focus:border-yellow-500'
          }`}
          style={{ fontFamily: 'inherit' }}
        />
      );
    }

    const displayValue = variable.type === 'currency' ? formatCurrency(rawValue) : rawValue;
    const placeholderText = isDisabled ? '🔒 잠김' : (variable.placeholder || variable.label);
    const size = Math.max((displayValue || placeholderText).length + 1, 4);

    // 잠김(disabled) 상태 — 회색 톤. 종속변수 입력 시 자동 활성화.
    if (isDisabled) {
      return (
        <input
          key={idx}
          ref={el => { inputRefs.current[order] = el; }}
          type="text"
          value=""
          disabled
          readOnly
          placeholder={placeholderText}
          size={size}
          tabIndex={-1}
          aria-disabled="true"
          title="이월결손금이 입력되어야 활성화됩니다"
          className="inline-block mx-0.5 px-2 py-0.5 rounded-md text-[15px] font-medium bg-slate-100 text-slate-400 border-b-2 border-dashed border-slate-300 cursor-not-allowed placeholder:text-slate-400"
          style={{ fontFamily: 'inherit', lineHeight: '1.4' }}
        />
      );
    }

    return (
      <input
        key={idx}
        ref={el => { inputRefs.current[order] = el; }}
        type="text"
        value={displayValue}
        onChange={(e) => handleInputChange(variable.key, e.target.value, variable.type)}
        onKeyDown={(e) => {
          if (e.key === 'Enter' || e.key === 'ArrowDown') {
            e.preventDefault(); goNext();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault(); goPrev();
          } else if (e.key === 'ArrowRight') {
            const inp = e.target;
            if (inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length) {
              e.preventDefault(); goNext();
            }
          } else if (e.key === 'ArrowLeft') {
            const inp = e.target;
            if (inp.selectionStart === 0 && inp.selectionEnd === 0) {
              e.preventDefault(); goPrev();
            }
          }
        }}
        onFocus={(e) => {
          e.target.select();
          setFocusedKey(variable.key);
          setTimeout(() => {
            try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (er) {}
            scrollPreviewToKey(variable.key);
          }, 0);
        }}
        placeholder={placeholderText}
        size={size}
        inputMode={variable.type === 'currency' ? 'numeric' : 'text'}
        className={`inline-block mx-0.5 px-2 py-0.5 rounded-md text-[15px] font-semibold transition-colors focus:outline-none placeholder:font-normal ${
          isNeg
            ? 'bg-rose-50 text-rose-900 border-b-2 border-dashed border-rose-500 focus:bg-rose-100 focus:border-rose-600 placeholder:text-rose-300'
            : 'bg-blue-50 text-blue-900 border-b-2 border-dashed border-blue-500 focus:bg-yellow-100 focus:border-yellow-600 placeholder:text-blue-300'
        }`}
        style={{ fontFamily: 'inherit', lineHeight: '1.4' }}
      />
    );
  };

  const renderTree = (nodes, vars) => {
    return nodes.map((node, idx) => {
      if (node.type === 'text') return <React.Fragment key={idx}>{node.value}</React.Fragment>;
      if (node.type === 'hint') {
        // 안내 힌트: 회색 작은 글씨로 표시. 클릭/입력 불가, 카톡 출력에 포함되지 않음.
        return (
          <span
            key={idx}
            className="inline-block mx-0.5 px-1.5 py-0 text-[12px] italic text-slate-400 select-none align-middle"
            title="에디터에만 표시되는 안내문구 (카톡 출력에는 포함되지 않음)"
          >
            {node.value}
          </span>
        );
      }
      if (node.type === 'inputonly') {
        // 입력 전용 마커: 에디터 화면에 입력 필드를 표시. 최종 출력에는 포함되지 않음.
        const variable = vars.find(v => v.key === node.key);
        if (!variable) return <span key={idx} className="text-red-500">{`{@${node.key}}`}</span>;
        // 이후 같은 키의 {변수명}은 출력 위치 표시(읽기 전용 미리보기)로 렌더링
        renderedKeys.current.add(node.key);
        const order = orderCounter.current.value++;
        return renderInput(variable, order, idx);
      }
      if (node.type === 'var') {
        const variable = vars.find(v => v.key === node.key);
        if (!variable) return <span key={idx} className="text-red-500">{`{${node.key}}`}</span>;

        if (variable.type === 'calculated') {
          const val = computeCalculated(node.key, inputs);
          const placeholderText = variable.placeholder || variable.label;
          return (
            <span key={idx} className="inline-block mx-0.5 px-2 py-0.5 rounded-md text-[15px] font-semibold bg-emerald-50 text-emerald-900 border-b-2 border-dashed border-emerald-400">
              {val || <span className="text-emerald-400 font-normal">{placeholderText}</span>}
            </span>
          );
        }

        if (renderedKeys.current.has(node.key)) {
          const rawValue = inputs[node.key] || '';
          let displayVal;
          if (variable.type === 'currency') {
            const d = String(rawValue).replace(/[^\d]/g, '');
            displayVal = d ? parseInt(d).toLocaleString('ko-KR') : '';
          } else {
            displayVal = rawValue;
          }
          return (
            <span key={idx} className="inline-block mx-0.5 px-2 py-0.5 rounded-md text-[14px] font-medium bg-violet-50 text-violet-700 border-b-2 border-dashed border-violet-400" title="출력 위치">
              {displayVal || <span className="text-violet-400 font-normal text-[12px]">↓ 출력 위치</span>}
            </span>
          );
        }
        renderedKeys.current.add(node.key);

        const order = orderCounter.current.value++;
        return renderInput(variable, order, idx);
      }
      if (node.type === 'cond') {
        const variable = vars.find(v => v.key === node.trigger);
        return (
          <span key={idx}>
            {variable?.type === 'switch' && (
              <label className="inline-flex items-center gap-1.5 mx-1 px-2 py-1 bg-amber-50 hover:bg-amber-100 border border-amber-400 rounded-md text-xs cursor-pointer font-medium text-amber-900 select-none align-middle">
                <input
                  type="checkbox"
                  checked={!!inputs[node.trigger]}
                  onChange={(e) => setInputs(prev => ({ ...prev, [node.trigger]: e.target.checked }))}
                  className="cursor-pointer"
                />
                <span>{variable.label || node.trigger}</span>
              </label>
            )}
            {renderTree(node.children, vars)}
          </span>
        );
      }
      return null;
    });
  };

  orderCounter.current.value = 0;
  renderedKeys.current.clear();

  // ===== 부팅 중 (localStorage 읽는 동안 잠깐) =====
  if (bootChecking) {
    return <div className="h-screen flex items-center justify-center bg-slate-50 text-slate-400 text-sm">로딩 중...</div>;
  }

  // ===== 접근 비밀번호 게이트 =====
  if (!accessGranted) {
    return (
      <div className="h-screen flex items-center justify-center bg-slate-50 p-4">
        <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-md border border-slate-200">
          <h2 className="text-lg font-bold mb-1 text-slate-900">세무법인삼호 메시지 도구</h2>
          <p className="text-xs text-slate-500 mb-4">사내 전용 도구입니다. 비밀번호를 입력해주세요.</p>
          <input
            type="password"
            value={accessInput}
            onChange={(e) => { setAccessInput(e.target.value); setAccessError(false); }}
            onKeyDown={(e) => e.key === 'Enter' && handleAccessSubmit()}
            placeholder="비밀번호"
            className={`w-full px-3 py-2 border rounded-lg mb-3 focus:ring-2 focus:outline-none ${accessError ? 'border-red-400 focus:ring-red-300' : 'border-slate-300 focus:ring-blue-500'}`}
            autoFocus
          />
          {accessError && <p className="text-xs text-red-600 mb-3">비밀번호가 일치하지 않습니다.</p>}
          <button onClick={handleAccessSubmit} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg font-semibold text-sm">입장</button>
          <p className="text-[11px] text-slate-400 mt-4 text-center">한 번 입력하면 이 PC에서는 다음부터 자동으로 열립니다.</p>
          <p className="text-[10px] text-slate-300 mt-2 text-center">업데이트 {BUILD_DATE}</p>
        </div>
      </div>
    );
  }

  return (
    <div className="h-screen bg-slate-50 flex flex-col overflow-hidden">
      {toast && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-lg shadow-lg text-white font-medium text-sm ${toast.type === 'error' ? 'bg-red-500' : 'bg-slate-900'}`}>
          {toast.message}
        </div>
      )}

      <header className="bg-white border-b border-slate-200 z-30 shadow-sm flex-shrink-0">
        <div className="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
          <h1 className="text-base font-bold text-slate-900">세무법인삼호 메시지 도구</h1>
          <div className="flex items-center gap-1.5">
            <span className="text-[11px] text-slate-400 mr-1 hidden sm:inline" title="이 도구가 마지막으로 갱신된 시각">업데이트 {BUILD_DATE}</span>
            <button
              onClick={handleHardReload}
              className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700"
              title="새로고침 (최신 양식 받기)"
            >
              <RefreshCw size={16} />
            </button>
            {adminMode ? (
              <button onClick={() => setAdminMode(false)} className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg text-sm font-medium flex items-center gap-1">
                <Lock size={14} /> 종료
              </button>
            ) : (
              <button onClick={() => setShowAdminLogin(true)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600" title="관리자 모드">
                <Settings size={17} />
              </button>
            )}
            <button onClick={handleAccessLogout} className="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600" title="로그아웃">
              <LogOut size={16} />
            </button>
          </div>
        </div>
      </header>

      {showAdminLogin && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-6 max-w-sm w-full">
            <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Lock size={18} /> 관리자 모드 로그인</h2>
            <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handlePasswordSubmit()} placeholder="관리자 비밀번호" className="w-full px-3 py-2 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none" autoFocus />
            <div className="flex gap-2">
              <button onClick={handlePasswordSubmit} className="flex-1 bg-slate-900 text-white py-2 rounded-lg">확인</button>
              <button onClick={() => { setShowAdminLogin(false); setPasswordInput(''); }} className="px-4 py-2 border border-slate-300 rounded-lg">취소</button>
            </div>
          </div>
        </div>
      )}

      {adminMode ? (
        <div className="flex-1 overflow-auto">
          <AdminPanel
            onSavePassword={async (pw) => { setAdminPassword(pw); await Storage.set('admin_password', pw); showToast('비밀번호 변경됨'); }}
            showToast={showToast}
          />
        </div>
      ) : !currentTemplate ? (
        <div className="flex-1 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-8 text-center text-slate-500 border border-dashed border-slate-300">
            <p className="font-medium">이 분류에는 아직 템플릿이 없습니다</p>
          </div>
        </div>
      ) : (
        <>
          <div className="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between gap-2 flex-wrap flex-shrink-0">
            <div className="flex items-center gap-1.5 flex-wrap">
              {types.map(t => (
                <button
                  key={t}
                  onClick={() => setSelectedType(t)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${selectedType === t ? 'bg-slate-900 text-white shadow' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'}`}
                >
                  {t}
                </button>
              ))}
              <span className="text-[11px] text-rose-600 font-medium ml-1 hidden md:inline">💡 음수(-) 입력 시 자동 (환급) 처리</span>
            </div>
            <button onClick={handleCopy} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold flex items-center gap-1.5 shadow whitespace-nowrap">
              <Copy size={15} /> 카톡용 복사
            </button>
          </div>

          {/* ===== 좌우 분할 컨테이너 ===== */}
          <div ref={splitContainerRef} className="flex-1 flex flex-row min-w-0 relative">
            <div
              className="overflow-y-auto bg-slate-50"
              style={{ width: `${splitPos}%` }}
            >
              <div className="max-w-4xl mx-auto p-3">
                <div className="bg-white rounded-xl px-5 py-5 shadow-sm border border-slate-200">
                  <div className="whitespace-pre-wrap text-[15px] leading-[2] text-slate-800 break-words">
                    {renderTree(tree, currentTemplate.variables || [])}
                  </div>
                </div>
              </div>
            </div>

            <div
              onMouseDown={handleDragStart}
              onTouchStart={handleDragStart}
              className="w-2 bg-slate-200 hover:bg-blue-400 active:bg-blue-500 cursor-col-resize flex items-center justify-center flex-shrink-0 transition-colors group select-none touch-none"
              title="드래그하여 너비 조절"
            >
              <GripVertical size={16} className="text-slate-500 group-hover:text-white pointer-events-none" />
            </div>

            <div
              ref={previewContainerRef}
              className="overflow-y-auto bg-white"
              style={{ width: `${100 - splitPos}%` }}
            >
              <div className="max-w-4xl mx-auto p-4">
                <div className="text-[14px] whitespace-pre-wrap leading-relaxed text-slate-800 break-words">
                  {previewParts.length === 0 ? (
                    <span className="text-slate-400 italic">위에서 값을 입력하면 여기에 결과가 표시됩니다.</span>
                  ) : (
                    previewParts.map((part, idx) => {
                      if (part.type === 'var') {
                        return (
                          <span
                            key={idx}
                            data-key={part.key}
                            className={focusedKey === part.key ? 'bg-yellow-200 rounded px-0.5 -mx-0.5 transition-colors' : ''}
                          >
                            {part.content}
                          </span>
                        );
                      }
                      return <React.Fragment key={idx}>{part.content}</React.Fragment>;
                    })
                  )}
                </div>
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function AdminPanel({ onSavePassword, showToast }) {
  const [pwInput, setPwInput] = useState('');

  return (
    <main className="max-w-5xl mx-auto p-4">
      <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 text-sm text-amber-900 flex items-center gap-2">
        <Lock size={16} /> 관리자 모드입니다. (빌드 {BUILD_DATE})
      </div>
      <div className="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <h3 className="font-bold mb-2">관리자 비밀번호 변경</h3>
        <div className="flex gap-2">
          <input type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)} placeholder="새 관리자 비밀번호" className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          <button onClick={() => { if (pwInput) { onSavePassword(pwInput); setPwInput(''); } }} className="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold">변경</button>
        </div>
        <p className="text-xs text-slate-500 mt-2">이 PC에만 적용됩니다. 다른 PC에서도 바꾸시려면 각 PC에서 똑같이 진행해야 합니다.</p>
      </div>
      <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 mt-4 text-sm text-slate-600">
        <h3 className="font-bold mb-2 text-slate-800">양식 수정 안내</h3>
        <p>본문 양식은 <code className="bg-white px-1 rounded border border-slate-200">index.html</code> 파일 안의 <code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY</code>(기장거래처)·<code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY_REPORT</code>(신고대리)·<code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY_COMBINED</code>(기장(인건비추가)) 부분을 직접 수정해야 합니다. GitHub에서 파일을 편집 → Commit → 직원 PC에서 헤더의 <strong>새로고침 버튼</strong>(또는 Ctrl+F5)으로 반영됩니다.</p>
        <p className="mt-2">수정 후 코드 상단의 <code className="bg-white px-1 rounded border border-slate-200">BUILD_DATE</code> 상수(<code>YYYY-MM-DD HH:MM</code> 형식)도 함께 갱신해 두면 직원이 최신 버전을 받았는지 헤더에서 바로 확인할 수 있습니다.</p>
      </div>
    </main>
  );
}

const rootEl = document.getElementById('root');
const loader = document.getElementById('boot-loader');
ReactDOM.createRoot(rootEl).render(<App />);
if (loader) loader.remove();
</script>
</body>
</html>
