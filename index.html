const formatCurrency = (val) => {
  if (val === '' || val == null) return '';
  const isNeg = String(val).startsWith('-');
  const digits = String(val).replace(/[^\d]/g, '');
  if (!digits) return isNeg ? '-' : '';
  const formatted = parseInt(digits).toLocaleString('ko-KR');
  return isNeg ? `-${formatted}` : formatted;
};

const isNegativeValue = (val) => val != null && String(val).startsWith('-');

const parseNum = (val) => {
  if (!val) return null;
  const isNeg = String(val).startsWith('-');
  const digits = String(val).replace(/[^\d]/g, '');
  if (!digits) return null;
  const n = parseInt(digits);
  return isNeg ? -n : n;
};

// ===== 환급 키 자동 탐지 =====
// 본문에 {?<key>_환급}{/?<key>_환급} 블록이 있는 변수만 음수 부호를 제거하고 절댓값으로 출력.
// 출력 옆에 "(환급)" 표기가 별도로 붙으므로 금액에 부호가 또 찍히면 중복됨.
// 그 외 currency 변수(소득, 매출 등)는 부호 그대로 보존.
const getRefundKeys = (body) => {
  const set = new Set();
  if (!body) return set;
  const re = /\{\?([^}/!][^}]*?)_환급\}/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    set.add(m[1].trim());
  }
  return set;
};

// 통화 출력 공통 포맷터: 환급키면 부호 제거(절댓값), 아니면 부호 보존.
// 입력 박스용 formatCurrency와는 별개 — 입력 박스에서는 음수 표시(빨강) 유지.
const formatCurrencyOutput = (rawValue, isRefundKey) => {
  const isNeg = String(rawValue).startsWith('-');
  const d = String(rawValue).replace(/[^\d]/g, '');
  if (!d) return '';
  const formatted = parseInt(d).toLocaleString('ko-KR');
  if (isRefundKey) return formatted;
  return isNeg ? '-' + formatted : formatted;
};

const calculateIncomeRate = (income, revenue) => {
  const i = parseNum(income);
  const r = parseNum(revenue);
  if (i === null || r === null || r === 0) return '';
  if (i < 0) return '-';
  return ((i / r) * 100).toFixed(1);
};

const calculateTax = (income) => {
  const i = typeof income === 'number' ? income : parseNum(income);
  if (i === null) return '';
  if (i <= 0) return '0';
  let tax;
  if (i <= 14000000) tax = i * 0.06;
  else if (i <= 50000000) tax = i * 0.15 - 1260000;
  else if (i <= 88000000) tax = i * 0.24 - 5760000;
  else if (i <= 150000000) tax = i * 0.35 - 15440000;
  else if (i <= 300000000) tax = i * 0.38 - 19940000;
  else if (i <= 500000000) tax = i * 0.40 - 25940000;
  else if (i <= 1000000000) tax = i * 0.42 - 35940000;
  else tax = i * 0.45 - 65940000;
  return Math.round(tax).toLocaleString('ko-KR');
};

const getProgressiveRate = (income) => {
  if (income == null || income <= 0) return '';
  if (income <= 14000000) return '6';
  if (income <= 50000000) return '15';
  if (income <= 88000000) return '24';
  if (income <= 150000000) return '35';
  if (income <= 300000000) return '38';
  if (income <= 500000000) return '40';
  if (income <= 1000000000) return '42';
  return '45';
};

const computeCalculated = (key, inputs) => {
  if (key === '소득률') return calculateIncomeRate(inputs['소득_당해'], inputs['매출_당해']);
  if (key === '소득률_전년') return calculateIncomeRate(inputs['소득_전년'], inputs['매출_전년']);
  if (key === '조정전_산출세액') {
    // 조정전 소득 = 소득_당해 + 추가증빙_경비2 + 추가인건비.
    // 소득_당해가 음수여도 추가증빙·추가인건비를 더해 조정전 소득이 양수면 산출세액 계산.
    const after = parseNum(inputs['소득_당해']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    const labor = parseNum(inputs['추가인건비']) || 0;
    if (after === null) return '';
    const before = after + adjust + labor;
    if (before <= 0) return '';
    return calculateTax(before);
  }
  if (key === '조정후_산출세액') {
    // 조정후 산출세액 라인 처리는 기존 그대로: 소득_당해가 양수일 때만 출력.
    const after = parseNum(inputs['소득_당해']);
    if (after === null || after <= 0) return '';
    return calculateTax(after);
  }
  if (key === '종합소득세_절감') {
    // 소득_당해 부호 무관. calculateTax는 음수/0 입력 시 '0' 반환하므로
    // 조정후가 결손이어도 절세효과 산식이 깨지지 않음.
    const after = parseNum(inputs['소득_당해']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    const labor = parseNum(inputs['추가인건비']) || 0;
    const sum = adjust + labor;
    if (after === null || sum <= 0) return '';
    const taxBefore = parseNum(calculateTax(after + sum));
    const taxAfter = parseNum(calculateTax(after));
    if (taxBefore === null || taxAfter === null) return '';
    const saving = taxBefore - taxAfter;
    if (saving <= 0) return '';
    return saving.toLocaleString('ko-KR');
  }
  if (key === '지방소득세_절감') {
    const g = parseNum(computeCalculated('종합소득세_절감', inputs));
    if (g === null) return '';
    return Math.round(g * 0.1).toLocaleString('ko-KR');
  }
  if (key === '건강보험료_절감') {
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    const labor = parseNum(inputs['추가인건비']) || 0;
    const sum = adjust + labor;
    if (sum <= 0) return '';
    return Math.round(sum * 0.0813).toLocaleString('ko-KR');
  }
  if (key === '절세액_합계') {
    const g = parseNum(computeCalculated('종합소득세_절감', inputs)) || 0;
    const j = parseNum(computeCalculated('지방소득세_절감', inputs)) || 0;
    const h = parseNum(computeCalculated('건강보험료_절감', inputs)) || 0;
    const total = g + j + h;
    if (total <= 0) return '';
    return total.toLocaleString('ko-KR');
  }
  if (key === '적용세율_조정전') {
    // getProgressiveRate는 음수/0이면 '' 반환하므로 조정전 소득 양수일 때만 자동 표기됨.
    const after = parseNum(inputs['소득_당해']);
    const adjust = parseNum(inputs['추가증빙_경비2']) || 0;
    const labor = parseNum(inputs['추가인건비']) || 0;
    if (after === null) return '';
    return getProgressiveRate(after + adjust + labor);
  }
  if (key === '지방세율_조정전') {
    const rate = parseFloat(computeCalculated('적용세율_조정전', inputs));
    if (isNaN(rate)) return '';
    return (rate * 0.1).toFixed(1);
  }
  if (key === '수수료_표시') {
    const fee = parseNum(inputs['수수료']);
    if (fee === null || fee <= 0) return '';
    const discount = !!inputs['할인적용'];
    const final = discount ? fee * 0.9 * 1.1 : fee * 1.1;
    return Math.round(final).toLocaleString('ko-KR');
  }
  if (key === '부담없음_매출') {
    const raw = inputs['추가경비_총액'] || '';
    const digits = String(raw).replace(/[^\d]/g, '');
    if (!digits) return '';
    return parseInt(digits).toLocaleString('ko-KR');
  }
  if (key === '반영전_소득') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    return (after + cost).toLocaleString('ko-KR');
  }
  if (key === '국세절감') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    const before = after + cost;
    const taxBefore = parseNum(calculateTax(before));
    const taxAfter = parseNum(calculateTax(after));
    if (taxBefore === null || taxAfter === null) return '';
    const saving = taxBefore - taxAfter;
    if (saving <= 0) return '';
    return saving.toLocaleString('ko-KR');
  }
  if (key === '지방세절감') {
    const gukSaving = parseNum(computeCalculated('국세절감', inputs));
    if (gukSaving === null) return '';
    return Math.round(gukSaving * 0.1).toLocaleString('ko-KR');
  }
  if (key === '건보절감') {
    const cost = parseNum(inputs['추가경비_총액']);
    if (cost === null || cost <= 0) return '';
    return Math.round(cost * 0.0813).toLocaleString('ko-KR');
  }
  if (key === '절세액') {
    const g = parseNum(computeCalculated('국세절감', inputs)) || 0;
    const j = parseNum(computeCalculated('지방세절감', inputs)) || 0;
    const h = parseNum(computeCalculated('건보절감', inputs)) || 0;
    const total = g + j + h;
    if (total <= 0) return '';
    return total.toLocaleString('ko-KR');
  }
  if (key === '적용세율') {
    const after = parseNum(inputs['반영후_소득']);
    const cost = parseNum(inputs['추가경비_총액']);
    if (after === null || cost === null) return '';
    return getProgressiveRate(after + cost);
  }
  if (key === '지방세율') {
    const rate = parseFloat(computeCalculated('적용세율', inputs));
    if (isNaN(rate)) return '';
    return (rate * 0.1).toFixed(1);
  }
  if (key === '수수료_합계_VAT포함') {
    let sum = 0;
    for (let n = 1; n <= 5; n++) {
      if (inputs[`박스${n}_이름`] && String(inputs[`박스${n}_이름`]).trim()) {
        sum += parseNum(inputs[`박스${n}_수수료`]) || 0;
      }
    }
    if (sum <= 0) return '';
    return Math.round(sum * 1.1).toLocaleString('ko-KR');
  }
  return '';
};

const isDependencySatisfied = (variable, inputs) => {
  if (!variable || !variable.dependsOn) return true;
  const depVal = inputs[variable.dependsOn];
  if (depVal == null) return false;
  const s = String(depVal).trim();
  if (!s) return false;
  const digits = s.replace(/[^\d]/g, '');
  if (!digits) return false;
  if (parseInt(digits) === 0) return false;
  return true;
};

// 현재 시각을 'YYYY-MM-DD HH:MM' 형식으로 반환 (자동저장·수동저장 타임스탬프용)
const nowStamp = () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

// inputs 객체에 실질적인 입력이 있는지 검사 (빈 자동저장 방지용)
const hasMeaningfulInput = (inputs, extraMemo) => {
  if (extraMemo && String(extraMemo).trim()) return true;
  if (!inputs) return false;
  return Object.values(inputs).some(v => {
    if (typeof v === 'boolean') return v;
    if (v == null) return false;
    return String(v).trim() !== '';
  });
};

const parseBody = (body) => {
  const root = { children: [] };
  const stack = [root];
  let lastIndex = 0;
  const re = /\{([^}]+)\}/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    if (m.index > lastIndex) {
      stack[stack.length - 1].children.push({ type: 'text', value: body.slice(lastIndex, m.index) });
    }
    const content = m[1].trim();
    if (content.startsWith('?')) {
      const trigger = content.slice(1).trim();
      const node = { type: 'cond', trigger, children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    } else if (content.startsWith('/?')) {
      const trigger = content.slice(2).trim();
      if (stack.length > 1 && stack[stack.length - 1].trigger === trigger) stack.pop();
    } else if (content.startsWith('@')) {
      const key = content.slice(1).trim();
      stack[stack.length - 1].children.push({ type: 'inputonly', key });
    } else if (content.startsWith('#')) {
      const hintText = content.slice(1).trim();
      stack[stack.length - 1].children.push({ type: 'hint', value: hintText });
    } else {
      stack[stack.length - 1].children.push({ type: 'var', key: content });
    }
    lastIndex = re.lastIndex;
  }
  if (lastIndex < body.length) {
    stack[stack.length - 1].children.push({ type: 'text', value: body.slice(lastIndex) });
  }
  return root.children;
};

const isCondActive = (trigger, inputs, variables) => {
  if (trigger.startsWith('!')) return !isCondActive(trigger.slice(1).trim(), inputs, variables);
  const hasAmount = (val) => {
    if (!val) return false;
    const digits = String(val).replace(/[^\d]/g, '');
    if (!digits) return false;
    return parseInt(digits) > 0;
  };
  if (trigger.endsWith('_환급')) {
    const base = trigger.slice(0, trigger.length - '_환급'.length);
    return hasAmount(inputs[base]) && isNegativeValue(inputs[base]);
  }
  if (trigger === '환급발생') return ['국세', '지방세'].some(k => hasAmount(inputs[k]) && isNegativeValue(inputs[k]));
  if (trigger === '세금없음') return ['국세', '지방세'].every(k => !hasAmount(inputs[k]));
  if (trigger === '세금있음') return !isCondActive('세금없음', inputs, variables);
  if (trigger === '_산출세액있음') return hasAmount(inputs['소득_당해']);
  if (trigger === '_절세효과있음') return computeCalculated('종합소득세_절감', inputs) !== '';
  if (trigger === '_추가증빙있음') return hasAmount(inputs['추가증빙_경비']) || hasAmount(inputs['추가증빙_경비2']);
  if (trigger === '_복수') {
    const names = ['박스1_이름','박스2_이름','박스3_이름','박스4_이름','박스5_이름'];
    return names.filter(k => inputs[k] && String(inputs[k]).trim()).length >= 2;
  }
  if (trigger === '소득률') return computeCalculated('소득률', inputs) !== '';
  if (trigger === '소득률_전년') return computeCalculated('소득률_전년', inputs) !== '';
  if (trigger.endsWith('_있음')) {
    const prefix = trigger.slice(0, trigger.length - '_있음'.length) + '_';
    return Object.keys(inputs).some(k => k.startsWith(prefix) && inputs[k] && String(inputs[k]).trim());
  }
  const variable = variables.find(v => v.key === trigger);
  if (variable?.dependsOn && !isDependencySatisfied(variable, inputs)) return false;
  if (variable?.type === 'switch') return !!inputs[trigger];
  const value = inputs[trigger];
  if (variable?.type === 'currency') return hasAmount(value);
  if (variable?.type === 'calculated') return computeCalculated(trigger, inputs) !== '';
  return !!(value && String(value).trim());
};

const ALIGN_PAIRS = [
  ['국　세', '지방세'],
  ['종합소득세', '지방소득세']
];
const alignAmountLines = (text) => {
  if (!text) return text;
  const lines = text.split('\n');
  for (let i = 0; i < lines.length - 1; i++) {
    const a = lines[i];
    const b = lines[i + 1];
    let matched = null;
    for (const [labA, labB] of ALIGN_PAIRS) {
      if (a.startsWith(labA + ' ') && b.startsWith(labB + ' ')) {
        matched = [labA, labB];
        break;
      }
    }
    if (!matched) continue;
    const [labA, labB] = matched;
    const aRest = a.slice(labA.length + 1);
    const bRest = b.slice(labB.length + 1);
    const max = Math.max(aRest.length, bRest.length);
    lines[i]     = labA + ' ' + aRest.padStart(max, ' ');
    lines[i + 1] = labB + ' ' + bRest.padStart(max, ' ');
  }
  return lines.join('\n');
};

const buildPrintContent = (template, inputs) => {
  if (!template) return '';
  const variables = template.variables || [];
  const refundKeys = getRefundKeys(template.body);
  const tree = parseBody(template.body);
  let output = '';
  const varRanges = [];
  const dynRanges = [];
  const cbRanges  = [];
  const walk = (nodes, insideCond) => {
    for (const node of nodes) {
      if (node.type === 'text') {
        const start = output.length;
        output += node.value;
        if (insideCond && node.value) dynRanges.push([start, output.length]);
      } else if (node.type === 'hint') {
      } else if (node.type === 'inputonly') {
      } else if (node.type === 'var') {
        const v = variables.find(x => x.key === node.key);
        if (!v) continue;
        let val;
        if (v.type === 'calculated') {
          val = computeCalculated(node.key, inputs);
        } else if (v.type === 'switch') {
          val = '';
        } else {
          val = inputs[node.key] || '';
          if (v.type === 'currency') {
            val = formatCurrencyOutput(val, refundKeys.has(node.key));
          }
        }
        const start = output.length;
        output += val || '';
        if (val) varRanges.push([start, output.length]);
      } else if (node.type === 'cond') {
        const trigger = node.trigger;
        const isNegated = trigger.startsWith('!');
        const cleanKey = isNegated ? trigger.slice(1).trim() : trigger;
        const v = variables.find(x => x.key === cleanKey);
        const active = isCondActive(trigger, inputs, variables);
        if (!active) continue;
        if (v && v.type === 'switch' && !isNegated && node.children.length > 0) {
          const label = v.label || cleanKey;
          const start = output.length;
          output += '\n☑ ' + label;
          cbRanges.push([start, output.length]);
        } else {
          walk(node.children, true);
        }
      }
    }
  };
  walk(tree, false);
  const rawLines = output.split('\n');
  const lineOffsets = [0];
  for (const l of rawLines) lineOffsets.push(lineOffsets[lineOffsets.length - 1] + l.length + 1);
  const overlap = (ranges, s, e) => {
    for (const [rs, re_] of ranges) if (rs < e && re_ > s) return true;
    return false;
  };
  const lines = rawLines.map((text, idx) => {
    const s = lineOffsets[idx];
    const e = s + text.length;
    const trimmed = text.trim();
    return {
      text,
      hasVar: overlap(varRanges, s, e),
      hasDyn: overlap(dynRanges, s, e),
      isCheckbox: overlap(cbRanges, s, e),
      isHeader: /^-.+-$/.test(trimmed) || /^\[.+\]$/.test(trimmed) || /^\d{4}년 귀속/.test(trimmed),
      isSeparator: /^⏬+$/.test(trimmed),
      isEmpty: trimmed === ''
    };
  });
  const sepIdx = lines.findIndex(l => l.isSeparator);
  const beforeSep = sepIdx >= 0 ? lines.slice(0, sepIdx) : lines.slice();
  const keepIdx = new Set();
  for (let i = 0; i < beforeSep.length; i++) {
    if (beforeSep[i].hasVar || beforeSep[i].hasDyn || beforeSep[i].isCheckbox) {
      keepIdx.add(i);
      for (let j = i - 1; j >= 0; j--) {
        if (beforeSep[j].isHeader) { keepIdx.add(j); break; }
        if (beforeSep[j].isEmpty) continue;
        break;
      }
    }
  }
  const result = [];
  let lastWasContent = false;
  let pendingEmpty = false;
  for (let i = 0; i < beforeSep.length; i++) {
    if (keepIdx.has(i)) {
      if (pendingEmpty && lastWasContent) result.push('');
      result.push(beforeSep[i].text);
      lastWasContent = true;
      pendingEmpty = false;
    } else if (beforeSep[i].isEmpty) {
      pendingEmpty = true;
    } else {
      pendingEmpty = false;
    }
  }
  if (sepIdx >= 0) {
    if (result.length > 0) result.push('');
    result.push(lines[sepIdx].text);
    result.push('');
    const memo = inputs['담당자멘트'];
    if (memo && String(memo).trim()) {
      result.push(String(memo).trim());
    } else {
      result.push('입력 없음');
    }
  }
  return alignAmountLines(result.join('\n'));
};

      ta.style.padding = '0';
      ta.style.border = 'none';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      const prevActive = document.activeElement;
      ta.focus({ preventScroll: true });
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (er) {}
      document.body.removeChild(ta);
      if (prevActive && prevActive.focus) {
        try { prevActive.focus({ preventScroll: true }); } catch (er) {}
      }
      if (ok) { showToast('클립보드에 복사되었습니다 ✓'); return; }
    } catch (e) {}
    try {
      const container = previewContainerRef.current;
      if (container) {
        const range = document.createRange();
        range.selectNodeContents(container);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        showToast('자동 선택됨 - Ctrl+C를 눌러 복사하세요', 'error');
        return;
      }
    } catch (e) {}
    showToast('복사 실패 - 미리보기 영역에서 직접 선택해 복사해 주세요', 'error');
  };

  const handleInputChange = (key, value, type) => {
    if (type === 'currency') {
      setInputs(prev => {
        const newHasMinus = String(value).includes('-');
        const digits = String(value).replace(/[^\d]/g, '');
        if (!digits) return { ...prev, [key]: newHasMinus ? '-' : '' };
        return { ...prev, [key]: newHasMinus ? `-${digits}` : digits };
      });
    } else {
      setInputs(prev => ({ ...prev, [key]: value }));
    }
  };

  const handlePasswordSubmit = () => {
    if (passwordInput === adminPassword) {
      setAdminMode(true); setShowAdminLogin(false); setPasswordInput('');
    } else showToast('비밀번호가 일치하지 않습니다', 'error');
  };

  const renderInput = (variable, order, idx) => {
    const rawValue = inputs[variable.key] || '';
    const isNeg = isNegativeValue(rawValue);
    const isDisabled = !!variable.dependsOn && !isDependencySatisfied(variable, inputs);

    const goNext = () => {
      let i = order + 1;
      while (i < inputRefs.current.length) {
        const next = inputRefs.current[i];
        if (next && !next.disabled) {
          next.focus();
          try { next.select(); } catch (er) {}
          return;
        }
        i++;
      }
    };
    const goPrev = () => {
      let i = order - 1;
      while (i >= 0) {
        const prev = inputRefs.current[i];
        if (prev && !prev.disabled) {
          prev.focus();
          try { prev.select(); } catch (er) {}
          return;
        }
        i--;
      }
    };

    if (variable.type === 'textarea') {
      return (
        <textarea
          key={idx}
          ref={el => { inputRefs.current[order] = el; }}
          value={rawValue}
          onChange={(e) => handleInputChange(variable.key, e.target.value, variable.type)}
          onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); goNext(); } }}
          onFocus={() => { setFocusedKey(variable.key); }}
          placeholder={variable.placeholder || variable.label}
          rows={Math.max(2, (rawValue.match(/\n/g) || []).length + 2)}
          className={`block w-full my-1 px-3 py-2 rounded-md text-[14px] leading-relaxed border focus:outline-none resize-y bg-white border-slate-300 text-slate-800 focus:border-blue-600 focus:ring-2 focus:ring-blue-200 placeholder:text-slate-400 placeholder:italic`}
          style={{ fontFamily: 'inherit' }}
        />
      );
    }

    const displayValue = variable.type === 'currency' ? formatCurrency(rawValue) : rawValue;
    const placeholderText = isDisabled ? '🔒 잠김' : (variable.placeholder || variable.label);
    const baseSize = Math.max((displayValue || placeholderText).length + 1, 4);
    const widthMul = variable.widthMul || (variable.wide ? 3 : 1);
    const size = widthMul > 1 ? Math.max(baseSize, placeholderText.length + 1) * widthMul : baseSize;

    if (isDisabled) {
      return (
        <input
          key={idx}
          ref={el => { inputRefs.current[order] = el; }}
          type="text"
          value=""
          disabled
          readOnly
          placeholder={placeholderText}
          size={size}
          tabIndex={-1}
          aria-disabled="true"
          title="이월결손금이 입력되어야 활성화됩니다"
          className="inline-block mx-0.5 px-2 py-1 rounded-md text-[14px] font-medium bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed italic placeholder:text-slate-400 print-mono-bg"
          style={{ fontFamily: 'inherit', lineHeight: '1.4' }}
        />
      );
    }

    return (
      <input
        key={idx}
        ref={el => { inputRefs.current[order] = el; }}
        type="text"
        value={displayValue}
        onChange={(e) => handleInputChange(variable.key, e.target.value, variable.type)}
        onKeyDown={(e) => {
          if (e.key === 'Enter' || e.key === 'ArrowDown') {
            e.preventDefault(); goNext();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault(); goPrev();
          } else if (e.key === 'ArrowRight') {
            const inp = e.target;
            if (inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length) {
              e.preventDefault(); goNext();
            }
          } else if (e.key === 'ArrowLeft') {
            const inp = e.target;
            if (inp.selectionStart === 0 && inp.selectionEnd === 0) {
              e.preventDefault(); goPrev();
            }
          }
        }}
        onFocus={(e) => {
          e.target.select();
          setFocusedKey(variable.key);
        }}
        placeholder={placeholderText}
        size={size}
        inputMode={variable.type === 'currency' ? 'numeric' : 'text'}
        className={`inline-block mx-0.5 px-2 py-1 rounded-md text-[14px] font-medium transition-colors focus:outline-none placeholder:font-normal placeholder:italic ${
          isNeg
            ? 'bg-white text-rose-700 border border-rose-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-200 placeholder:text-rose-300'
            : 'bg-white text-slate-900 border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-200 placeholder:text-slate-400'
        }`}
        style={{ fontFamily: 'inherit', lineHeight: '1.4' }}
      />
    );
  };

  const renderTree = (nodes, vars) => {
    return nodes.map((node, idx) => {
      if (node.type === 'text') return <React.Fragment key={idx}>{node.value}</React.Fragment>;
      if (node.type === 'hint') {
        return (
          <span
            key={idx}
            className="inline-block mx-0.5 px-1.5 py-0 text-[12px] italic font-medium text-blue-600 select-none align-middle"
            title="에디터에만 표시되는 안내문구 (카톡 출력에는 포함되지 않음)"
          >
            {node.value}
          </span>
        );
      }
      if (node.type === 'inputonly') {
        const variable = vars.find(v => v.key === node.key);
        if (!variable) return <span key={idx} className="text-red-500">{`{@${node.key}}`}</span>;
        renderedKeys.current.add(node.key);
        const order = orderCounter.current.value++;
        return renderInput(variable, order, idx);
      }
      if (node.type === 'var') {
        const variable = vars.find(v => v.key === node.key);
        if (!variable) return <span key={idx} className="text-red-500">{`{${node.key}}`}</span>;
        if (variable.type === 'calculated') {
          const val = computeCalculated(node.key, inputs);
          const placeholderText = variable.placeholder || variable.label;
          return (
            <span key={idx} className="inline-block mx-0.5 px-2 py-1 rounded-md text-[14px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 print-mono-bg">
              {val || <span className="text-emerald-400 font-normal italic">{placeholderText}</span>}
            </span>
          );
        }
        if (renderedKeys.current.has(node.key)) {
          const rawValue = inputs[node.key] || '';
          let displayVal;
          if (variable.type === 'currency') {
            displayVal = formatCurrencyOutput(rawValue, refundKeys.has(node.key));
          } else {
            displayVal = rawValue;
          }
          return (
            <span key={idx} className="inline-block mx-0.5 px-2 py-1 rounded-md text-[13px] font-medium bg-violet-50 text-violet-700 border border-violet-200 print-mono-bg" title="출력 위치">
              {displayVal || <span className="text-violet-400 font-normal italic text-[12px]">↓ 출력 위치</span>}
            </span>
          );
        }
        renderedKeys.current.add(node.key);
        const order = orderCounter.current.value++;
        return renderInput(variable, order, idx);
      }
      if (node.type === 'cond') {
        const boxM = node.trigger.match(/^박스(\d+)_이름$/);
        if (boxM && selectedType === '기장(인건비추가)') {
          const bn = parseInt(boxM[1], 10);
          if (bn > effectiveBoxCount + 1) return <React.Fragment key={idx} />;
          if (bn > effectiveBoxCount) {
            return (
              <button
                key={idx}
                onClick={() => setBoxCount(Math.min(5, effectiveBoxCount + 1))}
                className="block w-full my-2 border border-dashed border-blue-400 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg py-2.5 text-sm font-bold"
              >
                ＋ 인원 추가
              </button>
            );
          }
          return (
            <span key={idx} className="block border border-slate-300 rounded-lg my-2 overflow-hidden">
              <span className="flex items-center justify-between bg-slate-100 px-3 py-1.5 text-[13px] font-semibold text-slate-700">
                <span>인원 {bn}</span>
                <button
                  onClick={() => deleteBox(bn)}
                  className="text-rose-600 hover:text-white hover:bg-rose-500 border border-rose-300 rounded px-2 py-0.5 text-[11px] font-medium transition-colors"
                >
                  삭제
                </button>
              </span>
              <span className="block px-3 py-1">{renderTree(node.children, vars)}</span>
            </span>
          );
        }
        const variable = vars.find(v => v.key === node.trigger);
        const isSwitch = variable?.type === 'switch';
        const isChecked = isSwitch && !!inputs[node.trigger];
        // 같은 스위치 키가 본문에 여러 번 나오면 체크박스는 첫 등장에만 그리고,
        // 이후 등장은 음영 문구만 출력 (체크박스 입력 위치와 출력 위치 분리)
        const showCheckbox = isSwitch && !renderedSwitchKeys.current.has(node.trigger);
        if (isSwitch) renderedSwitchKeys.current.add(node.trigger);
        return (
          <span key={idx}>
            {showCheckbox && (
              <label className={`inline-flex items-center gap-1.5 mx-1 px-2 py-1 rounded-md text-xs cursor-pointer font-medium select-none align-middle border transition-colors ${
                isChecked
                  ? 'bg-blue-100 border-blue-500 text-blue-900 shadow-sm'
                  : 'bg-blue-50 border-blue-300 text-blue-800 hover:bg-blue-100'
              } print-mono-bg`}>
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={(e) => {
                    const checked = e.target.checked;
                    setInputs(prev => {
                      const next = { ...prev, [node.trigger]: checked };
                      if (checked) {
                        const group = EXCLUSIVE_SWITCH_GROUPS.find(g => g.includes(node.trigger));
                        if (group) group.forEach(k => { if (k !== node.trigger) next[k] = false; });
                      }
                      return next;
                    });
                  }}
                  className="cursor-pointer"
                />
                <span>{variable.label || node.trigger}</span>
              </label>
            )}
            {isSwitch ? (
              <span className={isChecked
                ? 'text-blue-700 font-medium bg-blue-50 rounded px-0.5'
                : 'text-slate-300 line-through'
              }>
                {renderTree(node.children, vars)}
              </span>
            ) : renderTree(node.children, vars)}
          </span>
        );
      }
      return null;
    });
  };

  orderCounter.current.value = 0;
  renderedKeys.current.clear();
  renderedSwitchKeys.current.clear();

  if (bootChecking) {
    return <div className="h-screen flex items-center justify-center bg-slate-50 text-slate-400 text-sm">로딩 중...</div>;
  }

  if (!accessGranted) {
    return (
      <div className="h-screen flex items-center justify-center bg-slate-50 p-4">
        <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-md border border-slate-200">
          <h2 className="text-lg font-bold mb-1 text-slate-900">세무법인삼호 메시지 도구</h2>
          <p className="text-xs text-slate-500 mb-4">사내 전용 도구입니다. 비밀번호를 입력해주세요.</p>
          <input
            type="password"
            value={accessInput}
            onChange={(e) => { setAccessInput(e.target.value); setAccessError(false); }}
            onKeyDown={(e) => e.key === 'Enter' && handleAccessSubmit()}
            placeholder="비밀번호"
            className={`w-full px-3 py-2 border rounded-lg mb-3 focus:ring-2 focus:outline-none ${accessError ? 'border-red-400 focus:ring-red-300' : 'border-slate-300 focus:ring-blue-500'}`}
            autoFocus
          />
          {accessError && <p className="text-xs text-red-600 mb-3">비밀번호가 일치하지 않습니다.</p>}
          <button onClick={handleAccessSubmit} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg font-semibold text-sm">입장</button>
          <p className="text-[11px] text-slate-400 mt-4 text-center">한 번 입력하면 이 PC에서는 다음부터 자동으로 열립니다.</p>
          <p className="text-[10px] text-slate-300 mt-2 text-center">업데이트 {BUILD_DATE}</p>
        </div>
      </div>
    );
  }

  const isBookkeeping = selectedType === '기장거래처';
  const isCombined = selectedType === '기장(인건비추가)';
  const isPrintProcessed = isBookkeeping || isCombined;

  const draftsByTab = TAB_LIST.reduce((acc, t) => {
    acc[t] = savedDrafts
      .filter(d => d.tab === t)
      .slice()
      .sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
    return acc;
  }, {});
  const autoSaveList = TAB_LIST.filter(t => autoSaves[t]).map(t => ({ ...autoSaves[t], _tabKey: t }));
  const hasAnyLoadable = autoSaveList.length > 0 || savedDrafts.length > 0;

  return (
    <div className="h-screen bg-slate-50 flex flex-col overflow-hidden">
      {toast && (
        <div className={`no-print fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-lg shadow-lg text-white font-medium text-sm ${toast.type === 'error' ? 'bg-red-500' : 'bg-slate-900'}`}>
          {toast.message}
        </div>
      )}

      <header className="no-print bg-white border-b border-slate-200 z-30 shadow-sm flex-shrink-0">
        <div className="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
          <h1 className="text-base font-bold text-slate-900">세무법인삼호 메시지 도구</h1>
          <div className="flex items-center gap-1.5">
            <span className="text-[11px] text-slate-400 mr-1 hidden sm:inline" title="이 도구가 마지막으로 갱신된 시각">업데이트 {BUILD_DATE}</span>
            <button onClick={handleHardReload} className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700" title="새로고침 (최신 양식 받기)"><RefreshCw size={16} /></button>
            <button onClick={togglePreview} className={`p-2 rounded-lg transition-colors ${previewVisible ? 'bg-blue-50 text-blue-600 hover:bg-blue-100' : 'hover:bg-slate-100 text-slate-400'}`} title={previewVisible ? '미리보기 끄기' : '미리보기 켜기'}>{previewVisible ? <Eye size={16} /> : <EyeOff size={16} />}</button>
            <button onClick={handlePrint} className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700" title={isPrintProcessed ? '인쇄 (입력값·체크박스 라벨만 출력)' : '인쇄 (입력박스 그대로 출력)'}><Printer size={16} /></button>
            {adminMode ? (
              <button onClick={() => setAdminMode(false)} className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg text-sm font-medium flex items-center gap-1"><Lock size={14} /> 종료</button>
            ) : (
              <button onClick={() => setShowAdminLogin(true)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600" title="관리자 모드"><Settings size={17} /></button>
            )}
            <button onClick={handleAccessLogout} className="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600" title="로그아웃"><LogOut size={16} /></button>
          </div>
        </div>
      </header>

      <div className="no-print bg-blue-50 border-b border-blue-200 text-blue-800 text-[11px] px-4 py-1.5 flex items-center gap-1.5 flex-shrink-0">
        <Info size={13} />
        <span><strong>저장 위치: 이 PC의 브라우저(Chrome/Edge) 내부</strong> · 다른 PC와 공유되지 않음 · 브라우저 캐시 삭제 시 함께 사라짐 · 입력 중 1초마다 자동저장</span>
      </div>

      {showAdminLogin && (
        <div className="no-print fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-6 max-w-sm w-full">
            <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Lock size={18} /> 관리자 모드 로그인</h2>
            <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handlePasswordSubmit()} placeholder="관리자 비밀번호" className="w-full px-3 py-2 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none" autoFocus />
            <div className="flex gap-2">
              <button onClick={handlePasswordSubmit} className="flex-1 bg-slate-900 text-white py-2 rounded-lg">확인</button>
              <button onClick={() => { setShowAdminLogin(false); setPasswordInput(''); }} className="px-4 py-2 border border-slate-300 rounded-lg">취소</button>
            </div>
          </div>
        </div>
      )}

      {showSaveModal && (
        <div className="no-print fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full shadow-xl">
            <h2 className="text-base font-bold mb-1 flex items-center gap-2"><Save size={16} /> 작업 저장</h2>
            <p className="text-xs text-slate-500 mb-3">탭: <strong className="text-slate-700">{selectedType}</strong></p>
            <label className="text-xs text-slate-600 block mb-1">작업명</label>
            <input
              type="text"
              value={saveName}
              onChange={(e) => setSaveName(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleSaveConfirm()}
              placeholder="예: 홍길동"
              className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm mb-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              autoFocus
            />
            <p className="text-[11px] text-slate-400 mb-4">고객명이 자동으로 채워집니다. 같은 탭에 같은 이름이 있으면 덮어쓰기를 묻습니다.</p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowSaveModal(false)} className="px-3 py-1.5 text-sm border border-slate-300 rounded-lg hover:bg-slate-50">취소</button>
              <button onClick={handleSaveConfirm} className="px-4 py-1.5 text-sm bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-semibold">저장</button>
            </div>
          </div>
        </div>
      )}

      {showLoadModal && (
        <div className="no-print fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-5 max-w-lg w-full shadow-xl max-h-[80vh] overflow-y-auto always-scroll">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-bold flex items-center gap-2"><FolderOpen size={16} /> 저장된 작업 불러오기</h2>
              <button onClick={() => setShowLoadModal(false)} className="p-1 hover:bg-slate-100 rounded text-slate-500"><X size={16} /></button>
            </div>

            {!hasAnyLoadable && (
              <p className="text-sm text-slate-400 text-center py-8">저장된 작업이 없습니다.</p>
            )}

            {autoSaveList.length > 0 && (
              <div className="mb-4">
                <p className="text-[11px] font-semibold text-slate-500 mb-1.5 px-1 flex items-center gap-1"><CloudCheck size={11} /> 자동저장 (탭별 최근 작업)</p>
                {autoSaveList.map(item => (
                  <div key={`auto-${item._tabKey}`} className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 mb-1.5 flex items-center gap-2">
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-slate-800 truncate">
                        {item._tabKey}
                        <span className="text-xs text-slate-400 font-normal ml-1.5">{item.inputs?.['고객명'] ? `${item.inputs['고객명']} (작업 중)` : '(작업 중)'}</span>
                      </p>
                      <p className="text-[11px] text-slate-400">{item.savedAt}</p>
                    </div>
                    <button onClick={() => handleLoadDraft(item)} className="px-2.5 py-1 text-xs border border-slate-300 rounded hover:bg-white">불러오기</button>
                    <button onClick={() => handleDeleteAutoSave(item._tabKey)} className="p-1 text-slate-400 hover:text-rose-500" title="삭제"><Trash size={13} /></button>
                  </div>
                ))}
              </div>
            )}

            {TAB_LIST.map(tab => {
              const list = draftsByTab[tab];
              if (!list || list.length === 0) return null;
              return (
                <div key={`group-${tab}`} className="mb-4">
                  <p className="text-[11px] font-semibold text-slate-500 mb-1.5 px-1 flex items-center gap-1"><Save size={11} /> 수동저장 — {tab}</p>
                  {list.map(d => (
                    <div key={d.id} className="bg-white border border-slate-200 rounded-lg px-3 py-2 mb-1.5 flex items-center gap-2">
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-medium text-slate-800 truncate">{d.name}</p>
                        <p className="text-[11px] text-slate-400">{d.savedAt}</p>
                      </div>
                      <button onClick={() => handleLoadDraft(d)} className="px-2.5 py-1 text-xs border border-slate-300 rounded hover:bg-slate-50">불러오기</button>
                      <button onClick={() => handleDeleteDraft(d.id)} className="p-1 text-slate-400 hover:text-rose-500" title="삭제"><Trash size={13} /></button>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {adminMode ? (
        <div className="flex-1 overflow-auto always-scroll">
          <AdminPanel
            onSavePassword={async (pw) => { setAdminPassword(pw); await Storage.set('admin_password', pw); showToast('비밀번호 변경됨'); }}
            showToast={showToast}
          />
        </div>
      ) : !currentTemplate ? (
        <div className="flex-1 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl p-8 text-center text-slate-500 border border-dashed border-slate-300">
            <p className="font-medium">이 분류에는 아직 템플릿이 없습니다</p>
          </div>
        </div>
      ) : (
        <>
          <div className="no-print bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between gap-2 flex-wrap flex-shrink-0">
            <div className="flex items-center gap-1.5 flex-wrap">
              {types.map(t => (
                <button
                  key={t}
                  onClick={() => setSelectedType(t)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${selectedType === t ? 'bg-slate-900 text-white shadow' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'}`}
                >
                  {t}
                </button>
              ))}
              {autoSaveStatus && (
                <span className="text-[11px] text-emerald-700 ml-1 flex items-center gap-1" title="현재 입력 내용이 이 PC에 자동저장됨">
                  <CloudCheck size={11} /> {autoSaveStatus}
                </span>
              )}
              <span className="text-[11px] text-rose-600 font-medium ml-1 hidden md:inline">💡 음수(-) 입력 시 자동 (환급) 처리</span>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={handleSaveOpen} className="px-3 py-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1" title="현재 작업을 이름 붙여 저장"><Save size={13} /> 저장</button>
              <button onClick={() => setShowLoadModal(true)} className="px-3 py-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1" title="저장된 작업 불러오기"><FolderOpen size={13} /> 불러오기</button>
              <button onClick={handleClearCurrentTab} className="px-2 py-2 bg-white hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-slate-300 rounded-lg text-xs font-medium flex items-center gap-1" title="현재 탭의 입력값과 자동저장을 모두 비움"><Trash size={12} /></button>
              <button onClick={handleCopy} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold flex items-center gap-1.5 shadow whitespace-nowrap">
                <Copy size={15} /> 카톡용 복사
              </button>
            </div>
          </div>

          <div ref={splitContainerRef} className={`flex-1 flex flex-row min-w-0 min-h-0 relative ${isPrintProcessed ? 'no-print' : ''}`}>
            <div
              ref={editorScrollRef}
              className={`overflow-y-scroll always-scroll bg-slate-50 min-h-0 ${isPrintProcessed ? 'no-print' : 'print-full-width'}`}
              style={{ width: previewVisible ? `${splitPos}%` : '100%' }}
            >
              <div className="max-w-4xl mx-auto p-3">
                <div className="bg-white rounded-xl px-5 py-5 shadow-sm border border-slate-200">
                  <div className="whitespace-pre-wrap text-[15px] leading-[2] text-slate-800 break-words">
                    {renderTree(tree, currentTemplate.variables || [])}
                  </div>
                </div>
              </div>
            </div>

            {previewVisible && (
              <>
                <div
                  onMouseDown={handleDragStart}
                  onTouchStart={handleDragStart}
                  className="no-print w-2 bg-slate-200 hover:bg-blue-400 active:bg-blue-500 cursor-col-resize flex items-center justify-center flex-shrink-0 transition-colors group select-none touch-none"
                  title="드래그하여 너비 조절"
                >
                  <GripVertical size={16} className="text-slate-500 group-hover:text-white pointer-events-none" />
                </div>

                <div
                  ref={previewContainerRef}
                  className="no-print overflow-y-scroll always-scroll bg-white min-h-0"
                  style={{ width: `${100 - splitPos}%` }}
                >
                  <div className="max-w-4xl mx-auto p-4">
                    <div className="text-[14px] whitespace-pre-wrap leading-relaxed text-slate-800 break-words">
                      {previewParts.length === 0 ? (
                        <span className="text-slate-400 italic">위에서 값을 입력하면 여기에 결과가 표시됩니다.</span>
                      ) : (
                        previewParts.map((part, idx) => {
                          if (part.type === 'var') {
                            return (
                              <span
                                key={idx}
                                data-key={part.key}
                                className={focusedKey === part.key ? 'bg-yellow-200 rounded px-0.5 -mx-0.5 transition-colors' : ''}
                              >
                                {part.content}
                              </span>
                            );
                          }
                          return <React.Fragment key={idx}>{part.content}</React.Fragment>;
                        })
                      )}
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>

          {isPrintProcessed && (
            <div className="print-only">
              <div className="print-page">
                <div className="print-header">
                  <span className="print-title">세무법인삼호</span>
                  <span className="print-date">{printDate}</span>
                </div>
                <div className="print-body">{printContent || '(인쇄할 내용이 없습니다)'}</div>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function AdminPanel({ onSavePassword, showToast }) {
  const [pwInput, setPwInput] = useState('');
  return (
    <main className="max-w-5xl mx-auto p-4">
      <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 text-sm text-amber-900 flex items-center gap-2">
        <Lock size={16} /> 관리자 모드입니다. (빌드 {BUILD_DATE})
      </div>
      <div className="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <h3 className="font-bold mb-2">관리자 비밀번호 변경</h3>
        <div className="flex gap-2">
          <input type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)} placeholder="새 관리자 비밀번호" className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          <button onClick={() => { if (pwInput) { onSavePassword(pwInput); setPwInput(''); } }} className="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold">변경</button>
        </div>
        <p className="text-xs text-slate-500 mt-2">이 PC에만 적용됩니다. 다른 PC에서도 바꾸시려면 각 PC에서 똑같이 진행해야 합니다.</p>
      </div>
      <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 mt-4 text-sm text-slate-600">
        <h3 className="font-bold mb-2 text-slate-800">양식 수정 안내</h3>
        <p>본문 양식은 <code className="bg-white px-1 rounded border border-slate-200">index.html</code> 파일 안의 <code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY</code>(기장거래처)·<code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY_REPORT</code>(신고대리)·<code className="bg-white px-1 rounded border border-slate-200">SIMPLE_BODY_COMBINED</code>(기장(인건비추가)) 부분을 직접 수정해야 합니다. GitHub에서 파일을 편집 → Commit → 직원 PC에서 헤더의 <strong>새로고침 버튼</strong>(또는 Ctrl+F5)으로 반영됩니다.</p>
        <p className="mt-2">수정 후 코드 상단의 <code className="bg-white px-1 rounded border border-slate-200">BUILD_DATE</code> 상수(<code>YYYY-MM-DD HH:MM</code> 형식)도 함께 갱신해 두면 직원이 최신 버전을 받았는지 헤더에서 바로 확인할 수 있습니다.</p>
      </div>
    </main>
  );
}

const rootEl = document.getElementById('root');
const loader = document.getElementById('boot-loader');
ReactDOM.createRoot(rootEl).render(<App />);
if (loader) loader.remove();
</script>
</body>
</html>
